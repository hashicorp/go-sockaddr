name: Build and Test Workflow

on:
    pull_request:
        branches: [ "master" ]
    push:
        branches: [ "master" ]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          max-parallel: 30
          matrix:
            version:
              - 'oldstable'
              - 'stable'
        steps:
            - name: Checkout Code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                go-version: ${{ matrix.version }}
            - name: Test Go
              run: go test -v -race -coverprofile=coverage.out ./...
            - name: Upload coverage report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with: 
                path: coverage.out
                name: coverage-report-${{matrix.version}}
            - name: Display coverage report
              run: go tool cover -func=coverage.out
    lint:
      name: Lint for target ${{ matrix.target }}
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        max-parallel: 30
        matrix:
          target: [linux-amd64, windows-amd64, darwin-arm64, aix-ppc64, solaris-amd64]
      steps:
          - name: Checkout Code
            uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          - name: Setup Go
            uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
            with:
              go-version: 'stable'
          - name: Set target platform
            run: | 
              {
                echo "GOOS=$(echo ${{ matrix.target }} | cut -d - -f1)" 
                echo "GOARCH=$(echo ${{ matrix.target }} | cut -d - -f2)"
              } >> "$GITHUB_ENV"
          - name: Run Linter
            uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
